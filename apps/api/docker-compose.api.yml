services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: starter-kit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_dev
      POSTGRES_DB: starter_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - starter-kit-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d starter_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: starter-kit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - starter-kit-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  starter-kit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
