# Docker Compose for Next.js Web Application
# Usage: docker-compose -f docker-compose.web.yml up -d

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_ENV: production
    image: starter-web:latest
    container_name: starter-web
    restart: unless-stopped

    # Environment variables (can also use .env file)
    environment:
      # Node.js configuration
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: '0.0.0.0'

      # Next.js configuration
      NEXT_TELEMETRY_DISABLED: 1

      # API connection (update with actual API URL)
      NEXT_PUBLIC_API_URL: http://api:3000

      # Database (if web app connects directly)
      # DATABASE_URL: postgresql://starter:password@postgres:5432/main

    ports:
      - '3000:3000'

    # Health check
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    # Networks (connect to API network)
    networks:
      - starter-network

networks:
  starter-network:
    external: true
