operations:
  - name: intake
    category: coordination
    description: Normalize the request, classify work, and decide whether research is required.

  - name: task-breakdown
    category: planning
    description: Emit executable epic and task YAML files with dependencies, ownership, and checks.

  - name: execute-task
    category: execution
    description: Complete one task while respecting ownership, policies, and evidence requirements.

  - name: review-change
    category: review
    description: Review changed and impacted code for bugs, regressions, and policy violations.

  - name: run-gates
    category: validation
    description: Run required repository checks and attach results to task evidence.

