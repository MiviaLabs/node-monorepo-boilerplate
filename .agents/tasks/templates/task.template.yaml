acceptance_criteria:
  - The requested outcome is implemented within the declared ownership boundary.
  - Changed and impacted behavior has been reviewed.
  - Required checks pass or have an explicit, justified skip.
  - Material assumptions have been verified against the current repository.
  - Relevant memories and lessons have been reviewed; recurrence prevention is explicit.

risk_areas: []
prior_lessons_reviewed: []
preflight_checks:
  - Read .agents/memories/MEMORY.md before edits begin.
  - Review matching lessons and risk patterns before edits begin.
memory_reference: .agents/memories/MEMORY.md
avoid_repeat_mistakes:
  - If `risk_areas` include `performance`, `latency`, `auth`, `frontend`, `api`, or `protected-flow`, record the current budget, expected post-change budget, fallback contract, and trace ownership before implementation.
  - Classify data on hot paths as critical-path versus optional before implementation, and keep optional summaries, counts, or candidate lists off the initial protected path unless measurements prove they belong there.
  - If a new cache candidate cannot be made correct with explicit write-owner coverage and strong invalidation semantics, reject or defer the cache instead of weakening the safety bar with TTL alone.

