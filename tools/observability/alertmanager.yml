# AlertManager Configuration
#
# AlertManager receives alerts from Prometheus and routes them to receivers.
# This configuration supports email, Slack, and webhook notifications.
#
# Documentation: https://prometheus.io/docs/alerting/latest/configuration/

global:
  # Global SMTP configuration for email notifications
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'password' # Use environment variable in production
  smtp_require_tls: true

  # Slack API URL (use environment variable in production)
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

  # Global resolve timeout
  resolve_timeout: 5m

# Route configuration - defines how alerts are routed
route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # Wait time before sending first notification for a new group
  group_wait: 30s

  # Wait time before sending notification about new alerts for an existing group
  group_interval: 5m

  # Wait time before re-notifying about a group that has already been notified
  repeat_interval: 12h

  # Child routes with specific matching
  routes:
    # Critical alerts go to critical receiver
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 5m

    # Database alerts go to database receiver
    - match:
        component: database
      receiver: 'database-team'
      group_by: ['alertname', 'component']

    # Queue alerts go to queue receiver
    - match:
        component: queue
      receiver: 'queue-team'
      group_by: ['alertname', 'component']

    # Infrastructure alerts go to infra receiver
    - match:
        component: node|postgres|redis|container
      receiver: 'infra-team'

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Inhibit warning alerts when critical alert is firing for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit high CPU when node is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*CPU.*'
    equal: ['instance']

  # Inhibit database pool alerts when database is down
  - source_match:
      alertname: 'ServiceDown'
      component: 'database'
    target_match:
      component: 'database'
    equal: ['instance']

# Receivers - notification destinations
receivers:
  # Default receiver - logs all alerts
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  # Critical alerts - immediate notification to all channels
  - name: 'critical'
    email_configs:
      - to: 'oncall@example.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: |
          <strong>{{ .GroupLabels.alertname }}</strong><br/>
          {{ range .Alerts }}
          <p>{{ .Annotations.description }}</p>
          <p>Started: {{ .StartsAt }}</p>
          {{ end }}
    slack_configs:
      - channel: '#alerts-critical'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Instance:* {{ .Labels.instance }}
          *Started:* {{ .StartsAt }}
          {{ end }}
        color: 'danger'
        send_resolved: true
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true

  # Database team receiver
  - name: 'database-team'
    email_configs:
      - to: 'database-team@example.com'
        headers:
          Subject: '[DB] {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#alerts-database'
        title: '[Database] {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
        color: 'warning'
        send_resolved: true

  # Queue team receiver
  - name: 'queue-team'
    email_configs:
      - to: 'queue-team@example.com'
        headers:
          Subject: '[Queue] {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#alerts-queue'
        title: '[Queue] {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
        color: 'warning'
        send_resolved: true

  # Infrastructure team receiver
  - name: 'infra-team'
    email_configs:
      - to: 'infra-team@example.com'
        headers:
          Subject: '[Infra] {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#alerts-infra'
        title: '[Infrastructure] {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
        color: 'warning'
        send_resolved: true

# Templates for notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
